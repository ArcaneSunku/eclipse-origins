plugins {
    id 'application'
}

ext {
    jomlVersion = "1.10.8"
    lwjglVersion = "3.4.1"
    imguiVersion = "1.89.0"
    nettyVersion = "4.2.14.Final"
    ashleyVersion = "1.7.4"
}

def dataDir = "${rootProject.projectDir}/data"

def osName = System.getProperty("os.name").toLowerCase()
def osArch = System.getProperty("os.arch").toLowerCase()
def lwjglNatives = ""
def imguiNatives = ""

if (osName.contains("linux")) {
    lwjglNatives = osArch.contains("aarch64") || osArch.contains("arm64")
            ? "natives-linux-arm64"
            : "natives-linux"
    imguiNatives = "natives-linux"
} else if (osName.contains("mac")) {
    lwjglNatives = osArch.contains("aarch64") || osArch.contains("arm64")
            ? "natives-macos-arm64"
            : "natives-macos"
    imguiNatives = "natives-macos"
} else {
    lwjglNatives = "natives-windows"
    imguiNatives = "natives-windows"
}


dependencies {
    implementation project(':core')

    implementation "org.joml:joml:$jomlVersion"
    implementation "org.lwjgl:lwjgl:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-glfw:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-opengl:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-openal:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-stb:$lwjglVersion"

    implementation "io.github.spair:imgui-java-binding:$imguiVersion"
    implementation "io.github.spair:imgui-java-lwjgl3:$imguiVersion"
    implementation "io.github.spair:imgui-java-$imguiNatives:$imguiVersion"

    implementation 'io.netty:netty-all:' + nettyVersion
    implementation 'com.badlogicgames.ashley:ashley:' + ashleyVersion

    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw:$lwjglVersion:$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl:$lwjglVersion:$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal:$lwjglVersion:$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb:$lwjglVersion:$lwjglNatives"

    runtimeOnly "io.github.spair:imgui-java-lwjgl3:$imguiVersion"
    runtimeOnly "io.github.spair:imgui-java-$imguiNatives:$imguiVersion"

}

application {
    mainClass = 'dev.atomixsoft.solar_eclipse.client.Client'

    if (osName.contains("mac")) {
        applicationDefaultJvmArgs = ["-XstartOnFirstThread"]
    }
}

task debug(type: JavaExec) {
    doFirst {
        gradle.startParameter.showStacktrace = ShowStacktrace.ALWAYS
        gradle.startParameter.logLevel = LogLevel.DEBUG

        classpath = files(dataDir) + sourceSets.main.runtimeClasspath
        workingDir = file(dataDir)

        println "Classpath is set to ${classpath.asPath}"
        println "Working directory is $workingDir"
    }

    group = 'application'
    description = 'Runs the Solar Eclipse Client in debug mode'

    standardInput = System.in

    mainClass = application.mainClass.get()
    
    jvmArgs = (osName.contains("mac") ? ["-XstartOnFirstThread"] : []) + [
            "-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:5007"
    ]
    ignoreExitValue = true

    //doLast {
    //    logging.level = LogLevel.INFO
    //    println "Debugging Solar Eclipse Client..."
    //}
}

tasks.named('run', JavaExec) {
    group = 'application'
    description = 'Runs the Solar Eclipse Client'

    ignoreExitValue = true
}
